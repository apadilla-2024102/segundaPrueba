<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Propiedades singulares</title>
    <meta name="description" content="Una selección privada de viviendas exclusivas. Entra en cada una y recórrela espacio a espacio.">
    <meta name="theme-color" content="#0d0d0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230d0d0f'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23c8a96a'%3EA%3C/text%3E%3C/svg%3E">
    <style>
        /* ================= Sistema de diseño ================= */
        :root {
            --fondo: #0d0d0f;
            --fondo-alt: #141417;
            --crema: #f3f0ea;
            --gris: rgba(243, 240, 234, .62);
            --oro: #c8a96a;
            --linea: rgba(255, 255, 255, .10);

            --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            --sans: "Inter", "Helvetica Neue", Arial, sans-serif;

            --curva: cubic-bezier(.2, .7, .2, 1);
            --ancho: 1240px;
            --seccion: clamp(80px, 12vw, 160px);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--crema);
            font-family: var(--sans);
            font-weight: 300;
            font-size: 1rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif {
            font-family: var(--serif);
            font-weight: 400;
            line-height: 1.02;
            letter-spacing: -0.01em;
            margin: 0;
        }

        p, ul, figure { margin: 0; }
        ul { padding: 0; list-style: none; }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        button { font: inherit; color: inherit; }

        :focus-visible { outline: 1px solid var(--oro); outline-offset: 4px; }

        .contenedor {
            width: 100%;
            max-width: calc(var(--ancho) + 48px);
            margin: 0 auto;
            padding: 0 24px;
        }

        .seccion { padding: var(--seccion) 0; }
        .seccion-alt { background: var(--fondo-alt); }

        .eyebrow {
            display: block;
            font-family: var(--sans);
            font-size: 0.72rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            color: var(--oro);
            margin-bottom: 22px;
        }

        .gris { color: var(--gris); }

        /* ---------- Botones ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 30px;
            border-radius: 100px;
            border: 1px solid var(--crema);
            background: transparent;
            color: var(--crema);
            font-family: var(--sans);
            font-size: 0.78rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            line-height: 1;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color .35s, border-color .35s, color .35s, transform .16s var(--curva);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-solido { background: var(--crema); color: var(--fondo); }
        .btn:active { transform: scale(0.97); }

        @media (hover: hover) and (pointer: fine) {
            .btn:hover { border-color: var(--oro); color: var(--oro); }
            .btn-solido:hover { background: var(--oro); border-color: var(--oro); color: var(--fondo); }
        }

        /* ---------- Aparición al hacer scroll ---------- */
        .rv {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.1s var(--curva), transform 1.1s var(--curva);
        }
        .rv.in { opacity: 1; transform: none; }

        /* Fundido al cambiar de vista */
        #app.fundido { animation: fundido .7s ease both; }
        @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }

        /* ---------- Fotos y degradado provisional ---------- */
        .foto {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            background: #1a1a1d;
        }
        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .foto.sin-foto { display: flex; align-items: center; justify-content: center; }
        .foto.sin-foto[data-tono="0"] { background: radial-gradient(120% 90% at 30% 20%, #5a4535 0%, #2c221b 45%, #141110 100%); }
        .foto.sin-foto[data-tono="1"] { background: radial-gradient(120% 90% at 30% 20%, #45505e 0%, #232931 45%, #111316 100%); }
        .foto.sin-foto[data-tono="2"] { background: radial-gradient(120% 90% at 30% 20%, #555741 0%, #2b2c20 45%, #121310 100%); }
        .foto.sin-foto::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%);
            pointer-events: none;
        }
        .foto-nombre {
            position: relative;
            z-index: 1;
            padding: 0 12%;
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(1.3rem, 2.4vw, 2rem);
            line-height: 1.15;
            text-align: center;
            color: rgba(255, 255, 255, .5);
        }

        .video-fondo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .video-fondo.listo { opacity: 1; }

        /* ---------- Menú superior ---------- */
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            border-bottom: 1px solid transparent;
            transition: background-color .4s, border-color .4s, backdrop-filter .4s;
        }
        .menu.solido {
            background: rgba(13, 13, 15, .82);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-bottom-color: var(--linea);
        }
        .menu .contenedor {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 76px;
        }
        .menu-marca { font-family: var(--serif); font-size: 1.5rem; line-height: 1; }
        .menu-volver {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--crema);
            transition: color .35s;
        }
        .menu .btn { padding: 12px 22px; }
        @media (hover: hover) and (pointer: fine) {
            .menu-volver:hover { color: var(--oro); }
        }

        /* ================= Catálogo ================= */
        .portada-catalogo {
            min-height: 78vh;
            min-height: 78svh;
            display: flex;
            align-items: flex-end;
            padding: 120px 0 70px;
        }
        .portada-catalogo h1 { font-size: clamp(3.4rem, 11vw, 9.5rem); max-width: 12ch; }
        .portada-catalogo p { margin-top: 30px; max-width: 520px; color: var(--gris); }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 30px 0 46px;
            border-top: 1px solid var(--linea);
        }
        .filtro {
            padding: 11px 22px;
            border-radius: 100px;
            border: 1px solid rgba(243, 240, 234, .22);
            background: none;
            color: var(--gris);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: border-color .35s, color .35s, transform .16s var(--curva);
            -webkit-tap-highlight-color: transparent;
        }
        .filtro:active { transform: scale(0.97); }
        .filtro[aria-pressed="true"] { border-color: var(--crema); color: var(--crema); }
        @media (hover: hover) and (pointer: fine) {
            .filtro:hover { color: var(--crema); }
        }

        .rejilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 34px 26px;
            padding-bottom: var(--seccion);
        }

        .tarjeta { display: block; -webkit-tap-highlight-color: transparent; }
        .tarjeta-foto { position: relative; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; }
        .tarjeta-foto .foto { position: absolute; inset: 0; transition: transform 1.4s var(--curva); }
        .etiqueta {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 2;
            padding: 7px 14px;
            border-radius: 100px;
            background: rgba(13, 13, 15, .55);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }
        .ver {
            position: absolute;
            inset: auto 0 0 0;
            z-index: 2;
            height: 45%;
            display: flex;
            align-items: flex-end;
            padding: 24px;
            background: linear-gradient(to top, rgba(13, 13, 15, .85), transparent);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .6s var(--curva), transform .6s var(--curva);
        }
        .tarjeta h3 { margin-top: 22px; font-size: 2.1rem; }
        .tarjeta-zona { margin-top: 6px; color: var(--gris); font-size: 0.92rem; }
        .tarjeta-pie {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--linea);
        }
        .tarjeta-datos { font-size: 0.8rem; color: var(--gris); }
        .tarjeta-precio { font-family: var(--serif); font-size: 1.25rem; white-space: nowrap; }

        @media (hover: hover) and (pointer: fine) {
            .tarjeta:hover .tarjeta-foto .foto { transform: scale(1.07); }
            .tarjeta:hover .ver { opacity: 1; transform: none; }
        }

        .vacio { color: var(--gris); padding-bottom: var(--seccion); }

        /* ================= Ficha ================= */
        .portada-ficha {
            position: relative;
            height: 100vh;
            height: 100svh;
            min-height: 560px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }
        .portada-ficha .foto-fondo {
            position: absolute;
            inset: 0;
            animation: acercar 14s ease-out both;
        }
        .portada-ficha .foto-fondo .foto { position: absolute; inset: 0; border-radius: 0; }
        .portada-ficha .foto-fondo .foto-nombre { display: none; }
        @keyframes acercar { from { transform: scale(1.08); } to { transform: scale(1); } }
        .portada-ficha::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(13,13,15,.35) 0%, rgba(13,13,15,.04) 38%, rgba(13,13,15,.12) 58%, rgba(13,13,15,.92) 100%);
        }
        .portada-ficha .contenedor { position: relative; z-index: 1; padding-bottom: clamp(48px, 9vh, 96px); }
        .portada-ficha h1 { font-size: clamp(3.2rem, 10vw, 8.5rem); }
        .portada-lema {
            margin: 18px 0 36px;
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(1.2rem, 2.4vw, 1.8rem);
            line-height: 1.3;
            color: var(--gris);
        }
        .desliza {
            position: absolute;
            z-index: 1;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            color: var(--gris);
        }

        .cabecera { max-width: 760px; margin-bottom: clamp(48px, 7vw, 80px); }
        .cabecera h2 { font-size: clamp(2.6rem, 6.5vw, 5.6rem); }
        .cabecera p { margin-top: 26px; max-width: 560px; color: var(--gris); }

        .espacios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }
        .espacio .foto { aspect-ratio: 4 / 5; }
        .espacio .foto img { transition: transform 1.4s var(--curva); }
        .espacio h3 { margin-top: 22px; font-size: 1.9rem; }
        .espacio p { margin-top: 8px; color: var(--gris); max-width: 36ch; }
        @media (hover: hover) and (pointer: fine) {
            .espacio:hover .foto img { transform: scale(1.06); }
        }

        .cifras {
            border-top: 1px solid var(--linea);
            border-bottom: 1px solid var(--linea);
            padding: 70px 0;
        }
        .cifras-fila {
            display: grid;
            grid-template-columns: repeat(var(--n, 4), 1fr);
            gap: 32px;
            text-align: center;
        }
        .cifra-num { font-family: var(--serif); font-size: clamp(3.4rem, 7vw, 5.5rem); line-height: 1; }
        .cifra-txt {
            display: block;
            margin-top: 14px;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.26em;
            color: var(--gris);
        }

        .panoramica {
            position: relative;
            height: 90vh;
            height: 90svh;
            min-height: 420px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }
        .panoramica-capa {
            position: absolute;
            left: 0;
            right: 0;
            top: -12%;
            height: 124%;
            will-change: transform;
        }
        .panoramica-capa .foto { position: absolute; inset: 0; border-radius: 0; }
        .panoramica-capa .foto-nombre { display: none; }
        .panoramica::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(13,13,15,.85) 0%, rgba(13,13,15,.2) 45%, transparent 70%);
        }
        .panoramica .contenedor { position: relative; z-index: 1; padding-bottom: clamp(48px, 8vw, 96px); }
        .panoramica p {
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(2.2rem, 5.5vw, 4.6rem);
            line-height: 1.05;
            max-width: 16ch;
        }

        .planos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 48px 40px;
        }
        .plano-lamina {
            aspect-ratio: 4 / 3;
            background: var(--crema);
            border-radius: 4px;
            padding: 22px;
            overflow: hidden;
        }
        .plano-lamina .foto { width: 100%; height: 100%; background: none; border-radius: 2px; }
        .plano-lamina .foto img { object-fit: contain; }
        .plano h3 { margin: 26px 0 14px; font-size: 2rem; }
        .plano ul { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
        .plano li {
            padding: 12px 0;
            border-bottom: 1px solid var(--linea);
            font-size: 0.92rem;
            color: var(--gris);
        }

        .dividido {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: clamp(40px, 7vw, 110px);
            align-items: center;
        }
        .dividido.invertido { grid-template-columns: 1fr 1.2fr; }
        .dividido.invertido .dividido-foto { order: 2; }
        .dividido-foto .foto { aspect-ratio: 4 / 5; }
        .dividido h2 { font-size: clamp(2.6rem, 5.5vw, 4.8rem); }
        .dividido-texto > p { margin-top: 26px; color: var(--gris); max-width: 46ch; }
        .puntos { margin-top: 36px; border-top: 1px solid var(--linea); }
        .puntos li {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--linea);
        }
        .puntos li::before { content: ""; flex: none; width: 14px; height: 1px; background: var(--oro); transform: translateY(-4px); }

        .galeria {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
        }
        .galeria-item {
            grid-column: span 2;
            position: relative;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
            text-align: left;
            border-radius: 4px;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .galeria-item .foto { aspect-ratio: 4 / 3; height: 100%; }
        .galeria-item.ancha { grid-column: span 4; }
        .galeria-item.ancha .foto { aspect-ratio: 16 / 9; }
        /* Si la última foto es ancha y queda sola, ocupa toda la fila */
        .galeria-item.completa { grid-column: 1 / -1; }
        .galeria-item.completa .foto { aspect-ratio: 21 / 9; }
        .galeria-item .foto img { transition: transform 1.4s var(--curva); }
        .galeria-item .foto-nombre { display: none; }
        .galeria-item figcaption {
            position: absolute;
            inset: auto 0 0 0;
            padding: 40px 20px 16px;
            background: linear-gradient(to top, rgba(13,13,15,.8), transparent);
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.15rem;
            line-height: 1.2;
        }
        @media (hover: hover) and (pointer: fine) {
            .galeria-item:hover .foto img { transform: scale(1.06); }
        }

        .visor {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 70px 76px 40px;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s, visibility .35s;
        }
        .visor.abierto { opacity: 1; visibility: visible; }
        .visor-marco { width: 100%; height: 100%; max-height: calc(100% - 50px); display: flex; align-items: center; justify-content: center; }
        .visor-marco .foto { width: 100%; height: 100%; background: none; border-radius: 0; }
        .visor-marco .foto img { object-fit: contain; }
        .visor-marco .foto.sin-foto { width: min(100%, 960px); height: auto; aspect-ratio: 16 / 10; border-radius: 4px; }
        .visor-pie { font-family: var(--serif); font-style: italic; font-size: 1.4rem; text-align: center; }
        .visor-contador { font-size: 0.7rem; letter-spacing: 0.24em; color: var(--gris); }
        .visor button {
            position: absolute;
            width: 52px;
            height: 52px;
            border: 1px solid rgba(243, 240, 234, .3);
            border-radius: 50%;
            background: rgba(13, 13, 15, .4);
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: border-color .35s, color .35s, transform .16s var(--curva);
        }
        .visor button:active { transform: scale(0.94); }
        .visor-cerrar { top: 16px; right: 16px; font-size: 1.1rem !important; }
        .visor-ant { left: 16px; top: 50%; margin-top: -26px; }
        .visor-sig { right: 16px; top: 50%; margin-top: -26px; }
        @media (hover: hover) and (pointer: fine) {
            .visor button:hover { border-color: var(--oro); color: var(--oro); }
        }

        .cercanos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            column-gap: 64px;
            border-top: 1px solid var(--linea);
        }
        .cercano {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 22px 0;
            border-bottom: 1px solid var(--linea);
        }
        .cercano span:first-child { font-family: var(--serif); font-size: 1.45rem; line-height: 1.2; }
        .cercano span:last-child { color: var(--gris); font-size: 0.9rem; white-space: nowrap; }

        .cierre { text-align: center; padding: clamp(120px, 18vw, 220px) 0; }
        .cierre h2 { font-size: clamp(3rem, 9vw, 7.5rem); }
        .cierre-precio { margin: 26px 0 44px; font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.2rem); color: var(--oro); }
        .cierre-telefonos { margin-top: 36px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; color: var(--gris); font-size: 0.9rem; }
        .cierre-telefonos a { transition: color .35s; }
        @media (hover: hover) and (pointer: fine) {
            .cierre-telefonos a:hover { color: var(--oro); }
        }

        /* ---------- Pie ---------- */
        .pie { border-top: 1px solid var(--linea); padding: 34px 0 calc(34px + env(safe-area-inset-bottom)); font-size: 0.8rem; color: var(--gris); }
        .pie .contenedor { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 28px; }
        .pie-telefonos { display: flex; flex-wrap: wrap; gap: 6px 22px; }

        /* ---------- WhatsApp flotante ---------- */
        .wa {
            position: fixed;
            right: 20px;
            bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 60;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #25d366;
            display: grid;
            place-items: center;
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .55), 0 4px 14px -4px rgba(37, 211, 102, .45);
            transition: transform .16s var(--curva), box-shadow .35s;
            -webkit-tap-highlight-color: transparent;
        }
        .wa:active { transform: scale(0.94); }
        .wa svg { width: 30px; height: 30px; fill: #fff; }
        @media (hover: hover) and (pointer: fine) {
            .wa:hover { transform: translateY(-2px); }
        }

        /* ---------- Móvil ---------- */
        @media (max-width: 760px) {
            .rejilla { grid-template-columns: 1fr; }
            .menu .contenedor { height: 64px; }
            .menu-marca { font-size: 1.3rem; }
            .menu-volver { font-size: 0.64rem; letter-spacing: 0.18em; }
            .desliza { display: none; }
            .cifras-fila { grid-template-columns: repeat(2, 1fr); row-gap: 48px; }
            .dividido, .dividido.invertido { grid-template-columns: 1fr; }
            .dividido.invertido .dividido-foto { order: 0; }
            .galeria { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .galeria-item { grid-column: span 1; }
            .galeria-item.ancha { grid-column: span 2; }
            .galeria-item figcaption { font-size: 1rem; padding: 30px 12px 10px; }
            .cercanos { grid-template-columns: 1fr; }
            .plano ul { grid-template-columns: 1fr; }
            .visor { padding: 64px 12px 30px; }
            .visor-ant, .visor-sig { top: auto; bottom: 22px; margin-top: 0; }
            .pie .contenedor { flex-direction: column; padding-right: 96px; }
            .cierre-telefonos { flex-direction: column; align-items: center; }
            .cierre { padding-bottom: 140px; }
        }

        @media (max-width: 380px) {
            .rejilla { grid-template-columns: 1fr; }
            .tarjeta-pie { flex-direction: column; gap: 6px; }
        }

        /* ---------- Movimiento reducido: fundidos sí, desplazamientos no ---------- */
        @media (prefers-reduced-motion: reduce) {
            .rv { transform: none; transition: opacity .6s ease; }
            .portada-ficha .foto-fondo { animation: none; }
            .panoramica-capa { transform: none !important; }
            .tarjeta-foto .foto, .espacio .foto img, .galeria-item .foto img { transition: none; }
        }
    </style>
</head>
<body>
    <header class="menu" id="menu">
        <div class="contenedor" id="menu-contenido"></div>
    </header>

    <main id="app"></main>

    <footer class="pie">
        <div class="contenedor" id="pie"></div>
    </footer>

    <!-- Visor de la galería a pantalla completa -->
    <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Galería" aria-hidden="true">
        <button class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">✕</button>
        <button class="visor-ant" id="visor-ant" aria-label="Foto anterior">‹</button>
        <button class="visor-sig" id="visor-sig" aria-label="Foto siguiente">›</button>
        <div class="visor-marco" id="visor-marco"></div>
        <p class="visor-pie" id="visor-pie"></p>
        <span class="visor-contador" id="visor-contador"></span>
    </div>

    <a class="wa" id="wa" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.6l-.4-.2-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 10 9.9 5.2 16 5.2S27 10 27 15.8 22.1 26.4 16 26.4zm6-7.8c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>
    </a>

    <script src="propiedades.js"></script>
    <!-- Fotos y vídeos de prueba: para quitarlos, borra esta línea y el archivo prueba.js -->
    <script src="prueba.js"></script>
    <script>
    (function () {
        "use strict";

        const app = document.getElementById("app");
        const menu = document.getElementById("menu");
        const menuContenido = document.getElementById("menu-contenido");
        const pie = document.getElementById("pie");
        const wa = document.getElementById("wa");
        const reducido = window.matchMedia("(prefers-reduced-motion: reduce)");
        let filtroActivo = "Todas";

        // ---------- Utilidades ----------
        function esc(texto) {
            return String(texto == null ? "" : texto).replace(/[&<>"']/g, (c) =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function lleno(valor) {
            if (!valor) return false;
            if (Array.isArray(valor)) return valor.length > 0;
            if (typeof valor === "object") {
                if ("espacios" in valor) return lleno(valor.espacios);
                if ("puntos" in valor || "foto" in valor) return Boolean(valor.foto || valor.texto || valor.titulo);
                return Object.keys(valor).length > 0;
            }
            return String(valor).trim() !== "";
        }

        function enlaceWhatsApp(p) {
            const mensaje = p
                ? "Hola, me interesa " + p.nombre + " (" + p.zona + "). Me gustaría agendar una visita."
                : "Hola, me interesan las propiedades de " + AGENCIA.nombre + ". Me gustaría agendar una visita.";
            return "https://wa.me/" + AGENCIA.whatsapp + "?text=" + encodeURIComponent(mensaje);
        }

        function telefonoHref(t) { return "tel:" + String(t).replace(/[^\d+]/g, ""); }

        // Tono del degradado provisional (marrón, gris azulado u oliva) según el nombre del archivo
        function tono(archivo) {
            let suma = 0;
            for (const c of String(archivo)) suma = (suma * 31 + c.charCodeAt(0)) >>> 0;
            return suma % 3;
        }

        // Una foto de la propiedad. Si el archivo no existe se cambia por el degradado.
        // Ruta de un archivo: una dirección completa (https://…) se usa tal cual;
        // un nombre de archivo se busca en fotos/<id>/.
        function ruta(p, archivo) {
            if (!archivo) return "";
            if (/^https?:\/\//.test(archivo)) return archivo;
            return "fotos/" + encodeURIComponent(p.id) + "/" + encodeURIComponent(archivo);
        }

        // Archivo de respaldo para probar la web sin fotos propias (ver prueba.js).
        function respaldo(p, archivo) {
            const mapa = window.FOTOS_PRUEBA || {};
            return (archivo && mapa[p.id + "/" + archivo]) || "";
        }

        function foto(p, archivo, nombre, lazy) {
            const src = ruta(p, archivo);
            const alt = respaldo(p, archivo);
            return '<div class="foto" data-tono="' + tono(p.id + "/" + (archivo || nombre)) + '" data-nombre="' + esc(nombre) + '"' +
                (alt ? ' data-respaldo="' + esc(alt) + '"' : '') + '>' +
                (src ? '<img src="' + src + '" alt="' + esc(nombre) + '"' + (lazy === false ? '' : ' loading="lazy"') + ' decoding="async">' : '') +
            '</div>';
        }

        function marcarSinFoto(div) {
            if (div.classList.contains("sin-foto")) return;
            const img = div.querySelector("img");
            if (img) img.remove();
            div.classList.add("sin-foto");
            const nombre = document.createElement("span");
            nombre.className = "foto-nombre";
            nombre.textContent = div.dataset.nombre || "";
            div.appendChild(nombre);
        }

        // Si la foto no carga, se prueba el respaldo y, si tampoco, el degradado.
        function fallo(div) {
            const img = div.querySelector("img");
            const alt = div.dataset.respaldo;
            if (img && alt && !div.dataset.usado) {
                div.dataset.usado = "1";
                img.addEventListener("error", () => marcarSinFoto(div), { once: true });
                img.src = alt;
                return;
            }
            marcarSinFoto(div);
        }

        function vigilarFotos(raiz) {
            raiz.querySelectorAll(".foto").forEach((div) => {
                const img = div.querySelector("img");
                if (!img) return marcarSinFoto(div);
                if (img.complete && img.naturalWidth === 0) return fallo(div);
                img.addEventListener("error", () => fallo(div), { once: true });
            });
            raiz.querySelectorAll("video[data-video]").forEach(vigilarVideo);
        }

        // ---------- Vídeo de fondo (portada y panorámica) ----------
        // Se pone encima de la foto; si no carga, se quita y queda la foto.
        function videoHTML(p, archivo) {
            const src = ruta(p, archivo) || respaldo(p, archivo);
            if (!src || reducido.matches) return "";
            const alt = ruta(p, archivo) ? respaldo(p, archivo) : "";
            return '<video class="video-fondo" data-video muted loop playsinline autoplay preload="auto"' +
                (alt ? ' data-respaldo="' + esc(alt) + '"' : '') + ' src="' + esc(src) + '"></video>';
        }

        function vigilarVideo(v) {
            v.muted = true;
            v.addEventListener("playing", () => v.classList.add("listo"));
            v.addEventListener("error", () => {
                if (v.dataset.respaldo && !v.dataset.usado) {
                    v.dataset.usado = "1";
                    v.src = v.dataset.respaldo;
                    v.play().catch(() => {});
                } else {
                    v.remove();
                }
            });
            v.play().catch(() => {});
        }

        // ---------- Aparición al hacer scroll ----------
        const observador = "IntersectionObserver" in window
            ? new IntersectionObserver((entradas) => {
                entradas.forEach((e) => {
                    if (!e.isIntersecting) return;
                    e.target.classList.add("in");
                    observador.unobserve(e.target);
                });
            }, { threshold: 0.12 })
            : null;

        function activarApariciones(raiz) {
            // Los elementos de una misma fila aparecen escalonados
            raiz.querySelectorAll("[data-escalon]").forEach((fila) => {
                Array.from(fila.children).forEach((hijo, i) => {
                    hijo.classList.add("rv");
                    hijo.style.transitionDelay = (i % 6) * 0.11 + "s";
                });
            });
            raiz.querySelectorAll(".rv").forEach((el) => {
                if (observador) observador.observe(el);
                else el.classList.add("in");
            });
        }

        // ---------- Menú: translúcido al bajar ----------
        function marcarMenu() { menu.classList.toggle("solido", window.scrollY > 40); }
        window.addEventListener("scroll", marcarMenu, { passive: true });

        // ---------- Parallax de la panorámica ----------
        let capaParallax = null;
        let parallaxPendiente = false;

        function moverParallax() {
            parallaxPendiente = false;
            if (!capaParallax || reducido.matches) return;
            const caja = capaParallax.parentElement.getBoundingClientRect();
            const alto = window.innerHeight;
            if (caja.bottom < 0 || caja.top > alto) return;
            const avance = (caja.top + caja.height / 2 - alto / 2) / (alto + caja.height);
            capaParallax.style.transform = "translate3d(0," + (avance * caja.height * 0.22).toFixed(1) + "px,0)";
        }

        window.addEventListener("scroll", () => {
            if (capaParallax && !parallaxPendiente) {
                parallaxPendiente = true;
                requestAnimationFrame(moverParallax);
            }
        }, { passive: true });
        window.addEventListener("resize", moverParallax);

        // ================= Vista catálogo =================
        function tipos() {
            const lista = [];
            PROPIEDADES.forEach((p) => { if (p.tipo && !lista.includes(p.tipo)) lista.push(p.tipo); });
            return ["Todas"].concat(lista);
        }

        function datosTarjeta(p) {
            return (p.cifras || []).slice(0, 3).map((c) => c[0] + " " + c[1]).join(" · ");
        }

        function tarjetaHTML(p) {
            return '<a class="tarjeta" href="#' + esc(p.id) + '">' +
                '<div class="tarjeta-foto">' +
                    foto(p, p.portada, p.nombre) +
                    (p.estado ? '<span class="etiqueta">' + esc(p.estado) + '</span>' : '') +
                    '<span class="ver">Ver propiedad →</span>' +
                '</div>' +
                '<h3>' + esc(p.nombre) + '</h3>' +
                '<p class="tarjeta-zona">' + esc(p.zona) + '</p>' +
                '<div class="tarjeta-pie">' +
                    '<span class="tarjeta-datos">' + esc(datosTarjeta(p)) + '</span>' +
                    (p.precio ? '<span class="tarjeta-precio">' + esc(p.precio) + '</span>' : '') +
                '</div>' +
            '</a>';
        }

        function pintarRejilla() {
            const rejilla = document.getElementById("rejilla");
            const lista = PROPIEDADES.filter((p) => filtroActivo === "Todas" || p.tipo === filtroActivo);
            rejilla.innerHTML = lista.length
                ? lista.map(tarjetaHTML).join("")
                : '<p class="vacio">No hay propiedades de este tipo ahora mismo.</p>';
            vigilarFotos(rejilla);
            activarApariciones(rejilla.parentElement);
        }

        function vistaCatalogo() {
            document.title = AGENCIA.nombre + " · " + AGENCIA.lemaCatalogo;
            menuContenido.innerHTML =
                '<a class="menu-marca" href="#">' + esc(AGENCIA.nombre) + '</a>' +
                '<a class="btn" href="' + enlaceWhatsApp() + '" target="_blank" rel="noopener">Contactar</a>';

            const lista = tipos();
            if (!lista.includes(filtroActivo)) filtroActivo = "Todas";

            app.innerHTML =
                '<section class="portada-catalogo"><div class="contenedor">' +
                    '<span class="eyebrow rv">' + esc(AGENCIA.nombre) + ' · Colección privada</span>' +
                    '<h1 class="rv">' + esc(AGENCIA.lemaCatalogo) + '</h1>' +
                    '<p class="rv">' + esc(AGENCIA.introCatalogo) + '</p>' +
                '</div></section>' +
                '<section class="contenedor" aria-label="Propiedades">' +
                    '<div class="filtros rv" role="group" aria-label="Filtrar por tipo">' +
                        lista.map((t) => '<button class="filtro" data-tipo="' + esc(t) + '" aria-pressed="' + (t === filtroActivo) + '">' + esc(t) + '</button>').join("") +
                    '</div>' +
                    '<div class="rejilla" id="rejilla" data-escalon></div>' +
                '</section>';

            app.querySelectorAll(".filtro").forEach((b) => {
                b.addEventListener("click", () => {
                    filtroActivo = b.dataset.tipo;
                    app.querySelectorAll(".filtro").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
                    pintarRejilla();
                });
            });

            pintarRejilla();
            activarApariciones(app);
            pie.innerHTML = '<span>' + esc(AGENCIA.nombre) + ' · Colección privada</span>' + telefonosPie();
            wa.href = enlaceWhatsApp();
            capaParallax = null;
        }

        function telefonosPie() {
            return '<span class="pie-telefonos">' + (AGENCIA.telefonos || []).map((t) =>
                '<a href="' + telefonoHref(t) + '">' + esc(t) + '</a>').join("") + '</span>';
        }

        // ================= Vista ficha =================
        function seccionRecorrido(p, r, alterna) {
            if (!lleno(r)) return "";
            return '<section class="seccion' + (alterna ? ' seccion-alt' : '') + '"><div class="contenedor">' +
                '<div class="cabecera">' +
                    '<span class="eyebrow rv">Recorrido</span>' +
                    (r.titulo ? '<h2 class="rv">' + esc(r.titulo) + '</h2>' : '') +
                    (r.intro ? '<p class="rv">' + esc(r.intro) + '</p>' : '') +
                '</div>' +
                '<div class="espacios" data-escalon>' + r.espacios.map((e) =>
                    '<article class="espacio">' +
                        foto(p, e.foto, e.titulo) +
                        '<h3>' + esc(e.titulo) + '</h3>' +
                        (e.texto ? '<p>' + esc(e.texto) + '</p>' : '') +
                    '</article>').join("") +
                '</div>' +
            '</div></section>';
        }

        function seccionCifras(p) {
            if (!lleno(p.cifras)) return "";
            return '<section class="cifras"><div class="contenedor">' +
                '<div class="cifras-fila" data-escalon style="--n:' + Math.min(p.cifras.length, 4) + '">' + p.cifras.map((c) =>
                    '<div><span class="cifra-num">' + esc(c[0]) + '</span><span class="cifra-txt">' + esc(c[1]) + '</span></div>'
                ).join("") + '</div>' +
            '</div></section>';
        }

        function seccionPanoramica(p) {
            const pano = p.panoramica;
            if (!lleno(pano)) return "";
            return '<section class="panoramica">' +
                '<div class="panoramica-capa">' + foto(p, pano.foto, pano.texto || p.nombre) + videoHTML(p, pano.video) + '</div>' +
                (pano.texto ? '<div class="contenedor"><p class="rv">' + esc(pano.texto) + '</p></div>' : '') +
            '</section>';
        }

        function seccionPlanos(p) {
            if (!lleno(p.planos)) return "";
            return '<section class="seccion"><div class="contenedor">' +
                '<div class="cabecera"><span class="eyebrow rv">Distribución</span><h2 class="rv">Planos</h2></div>' +
                '<div class="planos" data-escalon>' + p.planos.map((pl) =>
                    '<div class="plano">' +
                        '<div class="plano-lamina">' + foto(p, pl.foto, pl.titulo) + '</div>' +
                        '<h3>' + esc(pl.titulo) + '</h3>' +
                        (lleno(pl.estancias) ? '<ul>' + pl.estancias.map((e) => '<li>' + esc(e) + '</li>').join("") + '</ul>' : '') +
                    '</div>').join("") +
                '</div>' +
            '</div></section>';
        }

        function seccionDividida(p, bloque, eyebrow, invertido) {
            if (!lleno(bloque)) return "";
            return '<section class="seccion"><div class="contenedor dividido' + (invertido ? ' invertido' : '') + '">' +
                '<div class="dividido-foto rv">' + foto(p, bloque.foto, bloque.titulo || eyebrow) + '</div>' +
                '<div class="dividido-texto">' +
                    '<span class="eyebrow rv">' + eyebrow + '</span>' +
                    (bloque.titulo ? '<h2 class="rv">' + esc(bloque.titulo) + '</h2>' : '') +
                    (bloque.texto ? '<p class="rv">' + esc(bloque.texto) + '</p>' : '') +
                    (lleno(bloque.puntos) ? '<ul class="puntos rv">' + bloque.puntos.map((t) => '<li>' + esc(t) + '</li>').join("") + '</ul>' : '') +
                '</div>' +
            '</div></section>';
        }

        function seccionGaleria(p) {
            if (!lleno(p.galeria)) return "";
            return '<section class="seccion seccion-alt"><div class="contenedor">' +
                '<div class="cabecera"><span class="eyebrow rv">Galería</span><h2 class="rv">Cada detalle</h2></div>' +
                '<div class="galeria" data-escalon>' + p.galeria.map((g, i) =>
                    '<figure class="galeria-item' + (i % 5 === 0 ? ' ancha' : '') + (i % 5 === 0 && i === p.galeria.length - 1 ? ' completa' : '') + '" role="button" tabindex="0" data-indice="' + i + '" aria-label="Ampliar: ' + esc(g.texto) + '">' +
                        foto(p, g.foto, g.texto) +
                        (g.texto ? '<figcaption>' + esc(g.texto) + '</figcaption>' : '') +
                    '</figure>').join("") +
                '</div>' +
            '</div></section>';
        }

        function seccionUbicacion(p) {
            if (!lleno(p.cerca)) return "";
            const barrio = String(p.zona || "").split("·")[0].trim();
            return '<section class="seccion"><div class="contenedor">' +
                '<div class="cabecera"><span class="eyebrow rv">Ubicación</span><h2 class="rv">' + esc(barrio) + '</h2></div>' +
                '<div class="cercanos" data-escalon>' + p.cerca.map((c) =>
                    '<div class="cercano"><span>' + esc(c[0]) + '</span><span>' + esc(c[1]) + '</span></div>'
                ).join("") + '</div>' +
            '</div></section>';
        }

        function seccionCierre(p) {
            const telefonos = (AGENCIA.telefonos || []).map((t) => '<a href="' + telefonoHref(t) + '">' + esc(t) + '</a>').join("");
            return '<section class="cierre seccion-alt"><div class="contenedor">' +
                '<span class="eyebrow rv">' + esc(p.zona) + '</span>' +
                '<h2 class="rv">' + esc(p.nombre) + '</h2>' +
                '<p class="cierre-precio rv">' + esc(p.precio || "Precio a consultar") + '</p>' +
                '<div class="rv"><a class="btn btn-solido" href="' + enlaceWhatsApp(p) + '" target="_blank" rel="noopener">Solicitar visita privada</a></div>' +
                (telefonos ? '<div class="cierre-telefonos rv">' + telefonos + '</div>' : '') +
            '</div></section>';
        }

        function vistaFicha(p) {
            document.title = p.nombre + " · " + AGENCIA.nombre;
            menuContenido.innerHTML =
                '<a class="menu-volver" href="#">← Todas las propiedades</a>' +
                '<a class="menu-marca" href="#">' + esc(AGENCIA.nombre) + '</a>';

            app.innerHTML =
                '<section class="portada-ficha">' +
                    '<div class="foto-fondo">' + foto(p, p.portada, p.nombre, false) + videoHTML(p, p.video) + '</div>' +
                    '<div class="contenedor">' +
                        '<span class="eyebrow rv">' + esc(p.zona) + '</span>' +
                        '<h1 class="rv">' + esc(p.nombre) + '</h1>' +
                        (p.lema ? '<p class="portada-lema rv">' + esc(p.lema) + '</p>' : '<div style="height:36px"></div>') +
                        '<div class="rv"><a class="btn btn-solido" href="' + enlaceWhatsApp(p) + '" target="_blank" rel="noopener">Solicitar visita</a></div>' +
                    '</div>' +
                    '<span class="desliza" aria-hidden="true">Desliza para recorrer la casa</span>' +
                '</section>' +
                seccionRecorrido(p, p.recorrido1, false) +
                seccionCifras(p) +
                seccionRecorrido(p, p.recorrido2, true) +
                seccionPanoramica(p) +
                seccionPlanos(p) +
                seccionDividida(p, p.dormitorio, "Descanso", false) +
                seccionDividida(p, p.bano, "Materiales", true) +
                seccionGaleria(p) +
                seccionUbicacion(p) +
                seccionCierre(p);

            vigilarFotos(app);
            activarApariciones(app);

            capaParallax = app.querySelector(".panoramica-capa");
            moverParallax();

            app.querySelectorAll(".galeria-item").forEach((item) => {
                const abrir = () => abrirVisor(p, Number(item.dataset.indice));
                item.addEventListener("click", abrir);
                item.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); }
                });
            });

            pie.innerHTML = '<span>' + esc(AGENCIA.nombre) + ' · ' + esc(p.nombre) + '</span>' + telefonosPie();
            wa.href = enlaceWhatsApp(p);
        }

        // ================= Visor de la galería =================
        const visor = document.getElementById("visor");
        const visorMarco = document.getElementById("visor-marco");
        const estadoVisor = { p: null, i: 0, origen: null };

        function verEnVisor(i) {
            const fotos = estadoVisor.p.galeria;
            estadoVisor.i = (i + fotos.length) % fotos.length;
            const g = fotos[estadoVisor.i];
            visorMarco.innerHTML = foto(estadoVisor.p, g.foto, g.texto, false);
            vigilarFotos(visorMarco);
            document.getElementById("visor-pie").textContent = g.texto || "";
            document.getElementById("visor-contador").textContent = (estadoVisor.i + 1) + " / " + fotos.length;
        }

        function abrirVisor(p, i) {
            estadoVisor.p = p;
            estadoVisor.origen = document.activeElement;
            verEnVisor(i);
            visor.classList.add("abierto");
            visor.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
            document.getElementById("visor-cerrar").focus();
        }

        function cerrarVisor() {
            if (!visor.classList.contains("abierto")) return;
            visor.classList.remove("abierto");
            visor.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
            if (estadoVisor.origen && estadoVisor.origen.focus) estadoVisor.origen.focus();
        }

        document.getElementById("visor-cerrar").addEventListener("click", cerrarVisor);
        document.getElementById("visor-ant").addEventListener("click", () => verEnVisor(estadoVisor.i - 1));
        document.getElementById("visor-sig").addEventListener("click", () => verEnVisor(estadoVisor.i + 1));
        visor.addEventListener("click", (e) => { if (e.target === visor || e.target === visorMarco) cerrarVisor(); });

        document.addEventListener("keydown", (e) => {
            if (!visor.classList.contains("abierto")) return;
            if (e.key === "Escape") cerrarVisor();
            if (e.key === "ArrowLeft") verEnVisor(estadoVisor.i - 1);
            if (e.key === "ArrowRight") verEnVisor(estadoVisor.i + 1);
        });

        // Deslizar con el dedo en el visor
        let toqueX = null;
        visor.addEventListener("touchstart", (e) => { toqueX = e.touches[0].clientX; }, { passive: true });
        visor.addEventListener("touchend", (e) => {
            if (toqueX === null) return;
            const d = e.changedTouches[0].clientX - toqueX;
            if (Math.abs(d) > 45) verEnVisor(estadoVisor.i + (d < 0 ? 1 : -1));
            toqueX = null;
        });

        // ================= Navegación por hash =================
        function mostrar() {
            cerrarVisor();
            const id = decodeURIComponent(location.hash.replace(/^#/, ""));
            const p = PROPIEDADES.find((x) => x.id === id);

            if (p) vistaFicha(p);
            else vistaCatalogo();

            window.scrollTo(0, 0);
            marcarMenu();
            app.classList.remove("fundido");
            void app.offsetWidth; // reinicia la animación de fundido
            app.classList.add("fundido");
        }

        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        window.addEventListener("hashchange", mostrar);
        mostrar();
    })();
    </script>
</body>
</html>
